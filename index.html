<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TODO</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
  <!-- file:// でも開けるように、ES Modules は使わない -->
  <script src="todo-core.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <main class="app">
    <h1>TODO</h1>

    <p id="notice" class="notice" role="alert" hidden></p>

    <form id="add-form" class="add">
      <input id="new-todo" class="field" type="text" maxlength="200" placeholder="やることを入力"
             aria-label="新しいタスク" autocomplete="off" autofocus>
      <button class="button" type="submit">追加</button>
    </form>

    <section class="card" aria-label="タスク一覧">
      <ul id="list" class="list" role="list"></ul>
      <p id="empty" class="empty" hidden></p>

      <footer class="footer">
        <span id="count" class="count" aria-live="polite"></span>
        <div class="filters" role="group" aria-label="表示の絞り込み">
          <button type="button" class="filter" data-filter="all" aria-pressed="true">すべて</button>
          <button type="button" class="filter" data-filter="active" aria-pressed="false">未完了</button>
          <button type="button" class="filter" data-filter="completed" aria-pressed="false">完了済み</button>
        </div>
        <button id="clear-completed" class="text-button" type="button">完了済みを削除</button>
      </footer>
    </section>
  </main>

  <div class="toast-region" role="status">
    <div id="toast" class="toast" hidden>
      <span id="toast-text" class="toast__text"></span>
      <button id="undo" class="text-button" type="button">元に戻す</button>
    </div>
  </div>

  <template id="item-template">
    <li class="item">
      <input type="checkbox" class="item__check" data-action="toggle">
      <span class="item__title"></span>
      <input type="text" class="field item__edit" data-action="rename" maxlength="200"
             aria-label="タスク名を編集" autocomplete="off" hidden>
      <button type="button" class="text-button" data-action="edit">編集</button>
      <button type="button" class="text-button text-button--danger" data-action="delete">削除</button>
    </li>
  </template>
</body>
</html>
